<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Simon Game</h1>
     <h2>Press any Key to start the Game</h2>
     <div class="box-container" >
        <div class="box one" type="button" id="one"></div>
        <div class="box two" type="button" id="two"></div>
        <div class="box three" type="button" id="three"></div>
        <div class="box four" type="button" id="four"></div>
     </div>
     <script src="script.js"></script>
</body>
</html>
